[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clumping-factor-calculations"
version = "0.1.0"
description = "Modular clumping factor calculations for TNG gas and dark matter data."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "h5py",
    "matplotlib",
    "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
    "types-setuptools",
]

[project.scripts]
clumping = "clumping_factor.command:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"clumping_factor.methods.forest" = ["data/line_list.txt"]

[tool.pytest.ini_options]
addopts = "--strict-markers --basetemp=.t"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
no_site_packages = true
files = ["src/clumping_factor"]

[[tool.mypy.overrides]]
module = ["numpy", "numpy.*", "scipy", "scipy.*", "h5py", "h5py.*", "matplotlib", "matplotlib.*"]
follow_imports = "skip"

[[tool.mypy.overrides]]
module = [
    "clumping_factor.diagnostics.equations",
    "clumping_factor.diagnostics.service",
    "clumping_factor.infrastructure.campaigns",
    "clumping_factor.infrastructure.loaders",
    "clumping_factor.infrastructure.summary_cache",
    "clumping_factor.methods.clumping.alternative",
    "clumping_factor.methods.clumping.alternative_cli",
    "clumping_factor.methods.clumping.estimators",
    "clumping_factor.methods.clumping.fields",
    "clumping_factor.methods.clumping.service",
    "clumping_factor.methods.forest.cli",
    "clumping_factor.methods.forest.ionizing",
    "clumping_factor.methods.forest.ionizing_models",
    "clumping_factor.methods.forest.lines",
    "clumping_factor.methods.forest.service",
    "clumping_factor.methods.forest.spectra",
    "clumping_factor.methods.forest.workflow",
    "clumping_factor.methods.power_spectrum.service",
    "clumping_factor.methods.thermodynamics.service",
    "clumping_factor.visualization.aida_tng",
    "clumping_factor.visualization.benchmark",
    "clumping_factor.visualization.equations",
    "clumping_factor.visualization.plotting",
    "clumping_factor.visualization.thesan_igm",
]
ignore_errors = true
