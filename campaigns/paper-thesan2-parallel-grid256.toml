name = "paper-thesan2-parallel-grid256"
output_root = "results"

[simulation]
family = "thesan"
name = "Thesan-2"
base_path = "/lustre/work/carlos.lopez/Thesan-2/output"

[matrix]
snapshots = [80]
particle_types = ["dm"]
methods = ["clumping.pylians"]
grids = [256]

[method_options."clumping.pylians"]
filter_type = "Top-Hat"
radius_bins = 10
threshold_min = -1.0
threshold_max = 25.0
threshold_count = 200

[execution]
load_mode = "chunked"
chunk_size = 1000000
mas = "CIC"
radius_bin_batch_size = 1
summary_cache = "off"
work_partition = "auto"
max_file_readers = 2
memory_limit = "128gb"
memory_safety_fraction = 0.1

[benchmark]
# Three repetitions per setting; consecutive tasks use different worker counts.
worker_counts = [1, 2, 4, 8, 12, 16]
repeats = 3
order = [1, 16, 2, 12, 4, 8, 12, 2, 16, 4, 8, 1, 4, 1, 8, 2, 12, 16]
output_root = "reports/parallelization_benchmark_runs"

[resources]
# Use the same allocation as the completed 512^3 controlled sweep.
cpus = 16
memory = "128gb"
walltime = "24:00:00"
queue = "mini"
