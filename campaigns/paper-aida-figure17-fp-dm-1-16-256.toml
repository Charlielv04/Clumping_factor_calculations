name = "paper-aida-figure17-fp-dm-1-16-256"
output_root = "results"

# Focused replacement for the existing Figure 17 middle-panel analogue.
# These are the full-physics AIDA runs, using the dark-matter component.
# The 1/16/256 folds match the AREPO convention used in the consistency test.

[[simulations]]
family = "aida-tng"
name = "L35n1080_CDM"
base_path = "/lustre/work/egaraldi/AIDA-TNG/L35n1080_CDM/output"

[[simulations]]
family = "aida-tng"
name = "L35n1080_SIDM1"
base_path = "/lustre/work/egaraldi/AIDA-TNG/L35n1080_SIDM1/output"

[[simulations]]
family = "aida-tng"
name = "L35n1080_vSIDM"
base_path = "/lustre/work/egaraldi/AIDA-TNG/L35n1080_vSIDM/output"

[[simulations]]
family = "aida-tng"
name = "L35n1080_WDM3"
base_path = "/lustre/work/egaraldi/AIDA-TNG/L35n1080_WDM3/output"

[[simulations]]
family = "aida-tng"
name = "L75n910_CDM"
base_path = "/lustre/work/egaraldi/AIDA-TNG/L75n910_CDM/output"

[[simulations]]
family = "aida-tng"
name = "L75n910_SIDM1"
base_path = "/lustre/work/egaraldi/AIDA-TNG/L75n910_SIDM1/output"

[[simulations]]
family = "aida-tng"
name = "L75n910_vSIDM"
base_path = "/lustre/work/egaraldi/AIDA-TNG/L75n910_vSIDM/output"

[[simulations]]
family = "aida-tng"
name = "L75n910_WDM3"
base_path = "/lustre/work/egaraldi/AIDA-TNG/L75n910_WDM3/output"

[matrix]
snapshots = [99]
particle_types = ["dm"]
methods = ["power-spectrum.combined"]
grids = [512]

[method_options."power-spectrum.combined"]
fold_factors = [1, 16, 256]
bin_count = 80
binning = "log"
smoothing = "none"
pylians_mas = "CIC"

[execution]
threads = 8
load_mode = "chunked"
chunk_size = 1000000
mas = "CIC"

[resources]
cpus = 8
memory = "128gb"
walltime = "24:00:00"
queue = "mini"
