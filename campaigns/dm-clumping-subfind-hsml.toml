[matrix]
# Each simulation contributes every snapshot that actually exists under its output path.
snapshots = "available"
particle_types = ["dm"]
methods = ["pylians"]
grids = [256]

[method_options."clumping.pylians"]
filter_type = "Top-Hat"
radius_bins = 32

[execution]
threads = 8
load_mode = "chunked"
chunk_size = 1000000
mas = "CIC"
radius_bin_batch_size = 2

[resources]
cpus = 8
memory = "128gb"
walltime = "24:00:00"
queue = "mini"
