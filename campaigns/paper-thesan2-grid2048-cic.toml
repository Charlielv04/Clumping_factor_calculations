name = "paper-thesan2-grid2048-cic"
output_root = "results"

[simulation]
family = "thesan"
name = "Thesan-2"
base_path = "/lustre/work/carlos.lopez/Thesan-2/output"

[matrix]
# Single high-resolution extension of the completed snapshot-080 CIC/Pylians
# grid sequence, for the native-cell versus mesh reconstruction comparison.
snapshots = [80]
particle_types = ["gas"]
methods = ["clumping.pylians"]
grids = [2048]

[method_options."clumping.pylians"]
filter_type = "Top-Hat"
radius_bins = 10
threshold_min = -1.0
threshold_max = 25.0
threshold_count = 261
# With four workers, the estimator's 10% safety policy predicts a 447 GB
# peak grid allocation at 2048^3, within the 512 GB PBS request.
memory_limit = "512gb"

[execution]
threads = 4
load_mode = "chunked"
chunk_size = 1000000
mas = "CIC"
radius_bin_batch_size = 1

[resources]
cpus = 20
memory = "512gb"
walltime = "24:00:00"
queue = "small"
